name: our_finance
description: Personal & joint finance tracker app built with Flutter and Supabase.
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.6
  provider: ^6.1.2
  supabase_flutter: ^2.6.0
  google_fonts: ^6.2.1
  fl_chart: ^0.69.0
  font_awesome_flutter: ^10.7.0
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/

